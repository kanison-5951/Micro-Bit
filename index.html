<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินความพึงพอใจ - สอวน. คอมพิวเตอร์ 2569 โรงเรียนสตรีภูเก็ต</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // วาง Web App URL ที่ได้จากการ Deploy ใน Google Apps Script ไว้ในเครื่องหมายอัญประกาศ '' ด้านล่างนี้
        let GOOGLE_SCRIPT_URL = 'ใส่_WEB_APP_URL_ตรงนี้';

        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('POSN_SCRIPT_URL');
            if (savedUrl) {
                document.getElementById('scriptUrlInput').value = savedUrl;
            }
        });

        function openConfigModal() {
            document.getElementById('configModal').classList.remove('hidden');
            document.getElementById('configModal').classList.add('flex');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('flex');
            document.getElementById('configModal').classList.add('hidden');
        }

        function saveScriptUrl() {
            const url = document.getElementById('scriptUrlInput').value.trim();
            GOOGLE_SCRIPT_URL = url;
            localStorage.setItem('POSN_SCRIPT_URL', url);
            closeConfigModal();
            alert('บันทึก Web App URL เรียบร้อยแล้ว ระบบพร้อมส่งข้อมูลเข้า Google Sheets');
        }

        function copyAppsScriptCode() {
            const codeText = document.getElementById('scriptCodeText');
            codeText.select();
            document.execCommand('copy');
            
            const btnText = document.getElementById('copyBtnText');
            btnText.textContent = 'คัดลอกเรียบร้อย!';
            setTimeout(() => {
                btnText.textContent = 'คัดลอกโค้ด';
            }, 2000);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            
            // เปลี่ยนสถานะปุ่มเป็นกำลังส่งข้อมูล
            if (submitBtn) submitBtn.disabled = true;
            if (btnIcon) btnIcon.className = "fa-solid fa-spinner fa-spin";
            if (btnText) btnText.textContent = "กำลังบันทึกข้อมูล...";

            const form = document.getElementById('evalForm');
            const formData = new FormData(form);
            
            const payload = {
                timestamp: new Date().toLocaleString('th-TH'),
                q1: formData.get('q1') || '',
                q2: formData.get('q2') || '',
                q3: formData.get('q3') || '',
                q4: formData.get('q4') || '',
                q5: formData.get('q5') || '',
                q6: formData.get('q6') || '',
                q7: formData.get('q7') || '',
                q8: formData.get('q8') || '',
                impressions: formData.get('impressions') || '',
                suggestions: formData.get('suggestions') || ''
            };

            // หากมีการตั้งค่า Web App URL ให้ส่งข้อมูลไปยัง Google Sheet
            if (GOOGLE_SCRIPT_URL) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.error('Error submitting form:', err);
                }
            }

            // คืนค่าสถานะปุ่ม
            if (submitBtn) submitBtn.disabled = false;
            if (btnIcon) btnIcon.className = "fa-solid fa-paper-plane";
            if (btnText) btnText.textContent = "ส่งแบบประเมิน";

            // แสดงหน้าต่างแจ้งเตือนสำเร็จ
            document.getElementById('successModal').classList.remove('hidden');
            document.getElementById('successModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('flex');
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('evalForm').reset();
        }
    </script>
</body>
</html>
